<!doctype html>
<html lang="id">
<head>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&display=swap" rel="stylesheet">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FormFlow Dashboard</title>
  <link rel="stylesheet" href="css/app.css">
  <style>.tb-picker-wide { max-width: 260px; color: var(--text); font-weight: 700; }</style>
</head>
<body class="dash">
  <header class="tb">
    <div class="tb-left">
      <a class="tb-logo" href="index.html" aria-label="FormFlow">F</a>
      <select id="formPicker" class="tb-picker tb-picker-wide" aria-label="Pilih form"></select>
    </div>
    <nav class="tb-tabs" aria-label="Bagian">
      <a id="editLink" data-to="content" href="index.html">Konten</a>
      <a data-to="logic" href="index.html#logic">Logika</a>
      <a data-to="connect" href="index.html#connect">Integrasi</a>
      <a data-to="share" href="index.html#share">Bagikan</a>
      <a class="active" aria-current="page" href="#">Hasil</a>
    </nav>
    <div class="tb-right"></div>
  </header>
  <main class="panel" id="dash"></main>
  <div id="toast" class="toast" role="status"></div>
  <!-- Served by the Cloudflare Worker; harmless 404 on other hosts. -->
  <script src="formflow-config.js"></script>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
